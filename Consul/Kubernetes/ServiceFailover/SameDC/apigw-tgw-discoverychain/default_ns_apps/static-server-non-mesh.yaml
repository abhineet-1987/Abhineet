apiVersion: v1
kind: ServiceAccount
metadata:
  name: static-server-nonmesh
---
apiVersion: v1
kind: Service
metadata:
  name: static-server-nonmesh
spec:
  selector:
    app: static-server-nonmesh
  ports:
    - port: 1234
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: static-server-nonmesh
  name: static-server-nonmesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: static-server-nonmesh
  template:
    metadata:
      labels:
        app: static-server-nonmesh
    spec:
      serviceAccountName: static-server-nonmesh
      containers:
        - name: static-server-nonmesh
          image: hashicorp/http-echo:latest
          args:
            - -text="hello world from static-server-nonmesh default namespace"
            - -listen=:8080
          ports:
            - containerPort: 8080
              name: http
