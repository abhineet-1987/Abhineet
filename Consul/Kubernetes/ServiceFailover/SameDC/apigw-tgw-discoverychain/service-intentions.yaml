# 1. Allow traffic to static-server
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: static-server-intentions
  namespace: default
spec:
  destination:
    name: static-server
  sources:
    - name: api-gateway
      namespace: consul
      action: allow
    - name: static-client
      namespace: default
      action: allow
---
# 2. Allow traffic to static-server-nonmesh (The Terminating Gateway enforces this)
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: static-server-nonmesh-intentions
  namespace: default
spec:
  destination:
    name: static-server-nonmesh
  sources:
    - name: api-gateway
      namespace: consul
      action: allow
    - name: static-client
      namespace: default
      action: allow
---
# 3. Allow traffic to Tea v1
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: static-server-tea-v1-intentions
  namespace: default
spec:
  destination:
    name: static-server-tea-v1
  sources:
    - name: api-gateway
      namespace: consul
      action: allow
    - name: static-client
      namespace: default
      action: allow
---
# 4. Allow traffic to Tea v2
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: static-server-tea-v2-intentions
  namespace: default
spec:
  destination:
    name: static-server-tea-v2
  sources:
    - name: api-gateway
