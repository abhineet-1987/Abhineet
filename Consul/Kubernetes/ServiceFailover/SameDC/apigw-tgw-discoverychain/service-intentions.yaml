---
# 6. Allow traffic to Header Query Param service
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: static-server-header-query-param-intentions
  namespace: default
spec:
  destination:
    name: static-server-header-query-param
  sources:
    - name: api-gateway
      namespace: consul
      action: allow
    - name: static-client
      namespace: default
      action: allow
---
# 7. Allow Failover traffic into the Backup Namespace
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: backup-namespace-failover-intentions
  namespace: backup
spec:
  destination:
    # Applies to all failover services (Tea v1/v2, Coffee, Header/Query) in the backup namespace
    name: "*"
  sources:
    - name: api-gateway
      namespace: consul
      action: allow
    - name: static-client
      namespace: default
      action: allow
