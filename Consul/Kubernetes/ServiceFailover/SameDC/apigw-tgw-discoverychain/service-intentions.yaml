---
# 5. Allow traffic to Coffee
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: static-server-coffee-intentions
  namespace: default
spec:
  destination:
    name: static-server-coffee
  sources:
    - name: api-gateway
      namespace: consul
      action: allow
    - name: static-client
      namespace: default
